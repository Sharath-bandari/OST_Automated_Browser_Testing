<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
</head>

<body>

    <h1>Student Management</h1>

    <h2>Add Student</h2>

    <form method="POST" action="/add_student">

        <label>Name:</label>
        <input type="text" name="name" id="student_name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" id="student_email" required>

        <br><br>

        <button type="submit" id="add_student_button">
            Add Student
        </button>

    </form>

    <hr>

    <h2>Student List</h2>

    {% if students %}

        <table border="1">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
            </tr>
            {% endfor %}

        </table>

    {% else %}

        <p>No students added yet.</p>

    {% endif %}

</body>
</html>
